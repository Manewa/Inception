services:
  mariadb:
    container_name: mariadb
    networks:
      - inception
    build: 
      context: requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    env_file: .env
    secrets:
      - db_pass
      - db_root_pass
    volumes:
      - mariadb:/var/lib/mysql
    restart: unless-stopped
    expose:
      - 3306
  nginx:
    container_name: nginx
    volumes:
      - wordpress:/var/www/wordpress
    networks:
      - inception
    depends_on:
      - wordpress
    build: 
      context: requirements/nginx
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "443:443"
    restart: on-failure
  wordpress:
    container_name: wordpress
    env_file: .env
    secrets:
      - db_pass
      - wp_admin_pass
      - wp_user_pass
    volumes:
      - wordpress:/var/www/wordpress
    networks:
      - inception
    build: 
      context: requirements/wordpress
      dockerfile: Dockerfile
    depends_on:
      - mariadb
    restart: on-failure
    expose:
      - "9000"

volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: /home/namalier/data/mariadb
      o: bind
      type: none
  wordpress:
     name: wordpress
     driver: local
     driver_opts:
       device: /home/namalier/data/wordpress
       o: bind
       type: none

networks:
  inception:
    name: inception
    driver: bridge

secrets:
  db_pass:
    file: ./secrets/db_pass.txt
  db_root_pass:
    file: ./secrets/db_root_pass.txt
  wp_admin_pass:
    file: ./secrets/wp_admin_pass.txt
  wp_user_pass:
    file: ./secrets/wp_user_pass.txt
